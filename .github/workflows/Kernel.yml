name: Build NetHunter Kernel NX709S (5.10.168)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Install Build Dependencies & Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev \
            lz4 xz-utils wget curl python3 zip unzip cpio pahole \
            clang-14 lld-14 llvm-14

      - name: Setup Clang-14 as Default Toolchain
        run: |
          mkdir -p $HOME/clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            ln -sf /usr/bin/${tool}-14 $HOME/clang/bin/${tool}
          done

      - name: Clone Exact Kernel Source (5.10.168 - 61344663df42)
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth=1 origin 61344663df42 || git fetch --depth=1 origin common-android12-5.10-lts
          git checkout FETCH_HEAD

      - name: Inject NetHunter Configs (WiFi Injection, Monitor Mode, HID)
        run: |
          cd kernel
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_LOCALVERSION="-android12-9-nh"
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_RFKILL=y
          CONFIG_WLAN=y
          CONFIG_USB_RTL8152=m
          CONFIG_RTL8187=m
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_ATH9K_HTC=m
          CONFIG_MT7601U=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_RNDIS_HOST=m
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_BT_RFCOMM=y
          EOF

      - name: Compile Kernel & Modules
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN -d TRIM_UNUSED_KSYMS -d CFI_CLANG
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image modules

      - name: Package Flashable Zip with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/system/lib/modules
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \;
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../NetHunter-NX709S-5.10.168.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-NX709S-5.10.168
          path: NetHunter-NX709S-5.10.168.zip
          
