name: NX709S NetHunter GKI Modules

# Builds the missing external-adapter driver modules for the REDMAGIC 7S Pro
# (NX709S) STOCK kernel. Nothing is flashed; modules are loaded at runtime.
#
# Verified device facts (2026-10-29):
#   - Stock kernel 5.10.168-android12-9-00001-g61344663df42 (pristine Google
#     GKI, clang 12.0.5 r416183b), KMI android12-9
#   - cfg80211 + mac80211 are ALREADY loaded by the stock ROM at boot
#   - Only the adapter driver chains are missing -> that is all we build.
#
# PIN STRATEGY (v3): Google deleted the monthly kernel/common branches
# (android12-5.10-2023-04 no longer exists), so the repo-tool manifest route
# is dead. Instead we clone kernel/common's android12-5.10 branch and check
# out the EXACT commit the stock kernel was built from: 61344663df42 (it is
# written in the phone's own kernel version string). The build FAILS if the
# checked-out kernel version is not exactly 5.10.168.
#
# v4 fix: GitHub's 16 GB runners OOM-kill the FULL-LTO vmlinux link
# ("LTO vmlinux.o / Killed"). We add a 32 GB swapfile and switch the build
# to THIN LTO. LTO mode does not affect symbol CRCs (genksyms works from
# source), and the vmlinux is never shipped - only the modules are.

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: "kernel/common commit of the stock kernel"
        type: string
        default: "61344663df42"
      allow_version_mismatch:
        description: "Continue even if kernel version is not 5.10.168"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves \
            zip unzip python3 gcc-aarch64-linux-gnu curl git

      - name: Add 32 GB swap (vmlinux LTO link memory)
        continue-on-error: true
        run: |
          # The runner image already has an ACTIVE /swapfile (that is why v4
          # died with "Text file busy") - turn it off and recreate it bigger.
          # This step is insurance for the ThinLTO link; if swap setup fails
          # the build still continues (continue-on-error).
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 32G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=32768
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -m

      - name: Clone kernel/common and check out the exact stock commit
        run: |
          set -e
          git clone --single-branch --branch android12-5.10 --no-checkout \
            https://android.googlesource.com/kernel/common common
          cd common
          FULL=$(git rev-parse "${{ inputs.kernel_commit }}^{commit}")
          echo "Stock kernel commit: $FULL"
          git checkout "$FULL"
          {
            echo "kernel_commit=$FULL"
            echo "kernel_describe=$(git describe --always || true)"
          } > ../build-info.txt
          cat ../build-info.txt

      - name: Verify kernel version pin (must be 5.10.168)
        run: |
          KV=$(make -s -C common kernelversion)
          echo "Kernel version from source: $KV"
          echo "kernel_version=$KV" >> build-info.txt
          cat build-info.txt
          if [ "$KV" != "5.10.168" ] && [ "${{ inputs.allow_version_mismatch }}" != "true" ]; then
            echo "::error::Checked-out source is $KV, not 5.10.168. Aborting to protect KMI/CRC compatibility. Set allow_version_mismatch=true to override."
            exit 1
          fi

      - name: Fetch clang r416183b (stock toolchain)
        run: |
          set -e
          mkdir -p toolchain/clang
          ok=""
          for U in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz"; do
            echo "=== Trying: $U ==="
            if curl -fL "$U" -o toolchain/clang.tar.gz; then ok=1; break; fi
          done
          if [ -n "$ok" ]; then
            tar -xzf toolchain/clang.tar.gz -C toolchain/clang
            CLANG_BIN="$GITHUB_WORKSPACE/toolchain/clang/bin"
            "$CLANG_BIN/clang" --version | head -1
          else
            echo "::warning::r416183b archive unavailable - falling back to distro clang (symbol CRCs do not depend on the compiler)"
            sudo apt-get install -y clang lld llvm
            CLANG_BIN="/usr/bin"
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          {
            echo "ARCH=arm64"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
          } >> "$GITHUB_ENV"
          echo "clang_dir=$CLANG_BIN" >> build-info.txt

      - name: Configure adapter drivers as modules (=m)
        run: |
          set -e
          # v10: ATH9K_HTC (and ATH9K) contain `select MAC80211_LEDS if
          # LEDS_CLASS=...` - the select FORCE-enables mac80211 LED code,
          # whose led_trigger_* symbols do not exist in the stock kernel
          # core, so our mac80211 could never load and a plain -d never
          # stuck. Remove those select lines from the build-tree copy
          # (drivers degrade to LED stubs - harmless).
          files=$(grep -rl 'select MAC80211_LEDS' common/drivers/net/wireless/ || true)
          echo "Removing 'select MAC80211_LEDS' from: $files"
          for f in $files; do sed -i '/select MAC80211_LEDS/d' "$f"; done
          make -C common O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          # NOTE: CFG80211/MAC80211 are enabled ONLY so the drivers below can
          # be compiled. The stock ROM already provides both at runtime, so
          # the built cfg80211.ko/mac80211.ko go to the artifact's fallback/
          # folder and are NOT loaded by default.
          # Deliberately EXCLUDED (KMI/CRC safety): USER_NS, PID_NS, SYSVIPC,
          # MODULE_FORCE_LOAD/UNLOAD, USB_NET_AX88179_178A (vendor ships it).
          common/scripts/config --file common/out/.config \
            -m CFG80211 -m MAC80211 -m CRC_CCITT \
            -m ATH9K_HTC -m CARL9170 \
            -m RTL8187 -m RTL8XXXU \
            -m RT2800USB \
            -m MT7601U -m MT76x0U -m MT76x2U \
            -m BT_HCIBTUSB -m BT_HCIVHCI \
            -m USB_SERIAL -m USB_SERIAL_FTDI_SIO -m USB_SERIAL_CP210X \
            -m USB_SERIAL_CH341 -m USB_SERIAL_PL2303 \
            -m USB_USBNET -m USB_NET_AX8817X -m USB_NET_CDCETHER -m USB_NET_RNDIS_HOST
          # ---- v7 extras (all in-tree; warnings only, never fatal) ----
          # More WiFi: zd1211rw, rt73usb, rt2500usb, rtl8192cu (WN823N),
          # ath10k USB. Ethernet: r8152 (common Realtek dongles), smsc, dm9601.
          # CAN bus (gs_usb/slcan), NFC PN533 USB, 802.15.4 atusb,
          # RTL-SDR via DVB rtl28xxu, more serial (option/qualcomm), BT UART.
          common/scripts/config --file common/out/.config \
            -m ZD1211RW -m RT73USB -m RT2500USB -m RTL8192CU \
            -m ATH10K -m ATH10K_USB \
            -m USB_RTL8152 -m USB_NET_SMSC75XX -m USB_NET_SMSC95XX -m USB_NET_DM9601 \
            -m CAN -m CAN_DEV -m CAN_GS_USB -m CAN_SLCAN \
            -m NFC -m NFC_PN533 -m NFC_PN533_USB \
            -m IEEE802154 -m IEEE802154_ATUSB \
            -m MEDIA_SUPPORT -m DVB_CORE -m DVB_USB_V2 -m DVB_USB_RTL28XXU \
            -m USB_SERIAL_OPTION -m USB_SERIAL_QUALCOMM -m BT_HCIUART
          common/scripts/config --file common/out/.config \
            -e MEDIA_USB_SUPPORT
          # THIN instead of FULL LTO: fits the runner's RAM with swap.
          # CRCs are computed from source by genksyms, so this is safe.
          common/scripts/config --file common/out/.config \
            -e LTO_CLANG_THIN -d LTO_CLANG_FULL
          # CRITICAL (v6): gki_defconfig turns the WLAN VENDOR GATES OFF.
          # Every WiFi driver lives inside `if WLAN_VENDOR_*` blocks, so
          # without these the driver symbols are silently dropped by
          # olddefconfig (this is why the v5 artifact had no WiFi .ko).
          # v8: RT2X00 is ANOTHER menu gate (all rt2x00 drivers sit inside
          # `if RT2X00` - verified in the pinned source), and the mt76 lib
          # chain is forced explicitly after MT76x0U/MT76x2U dropped once
          # for no structural reason.
          common/scripts/config --file common/out/.config \
            -e WLAN_VENDOR_ATH -e WLAN_VENDOR_RALINK \
            -e WLAN_VENDOR_REALTEK -e WLAN_VENDOR_MEDIATEK \
            -m RT2X00 \
            -m MT76_CORE -m MT76_USB -m MT76x02_LIB -m MT76x02_USB \
            -m MT76x0_COMMON -m MT76x2_COMMON
          # v9 (from the stock-CRC probe, 90/90 match): the stock cfg80211
          # was built with NL80211_TESTMODE=y - it adds testmode members to
          # struct cfg80211_ops and is the ONLY difference in wiphy_new_nm's
          # CRC (stock 0xac389d85). And stock mac80211 was built with
          # MAC80211_LEDS=n - with LEDs on, our mac80211 imports led_*
          # symbols the stock kernel does not provide.
          common/scripts/config --file common/out/.config \
            -e NL80211_TESTMODE -d MAC80211_LEDS
          make -C common O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          # Second pass: any core driver still not =m gets a raw append and
          # one more olddefconfig (guards against config tooling quirks).
          retry=""
          for s in ATH9K_HTC CARL9170 RTL8187 RTL8XXXU RT2800USB MT7601U MT76x0U MT76x2U RT2X00; do
            grep -q "^CONFIG_${s}=m" common/out/.config || retry="$retry $s"
          done
          if [ -n "$retry" ]; then
            echo "Second pass (raw append) for:$retry"
            for s in $retry; do echo "CONFIG_${s}=m" >> common/out/.config; done
            make -C common O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          fi
          echo "--- Effective config (drivers) ---"
          grep -E 'CONFIG_(ATH9K_HTC|CARL9170|RTL8187|RTL8XXXU|RT2800USB|MT7601U|MT76x0U|MT76x2U|BT_HCIBTUSB|USB_SERIAL|USB_USBNET)=' common/out/.config || true
          # Fail LOUDLY if any driver got dropped again - never ship a
          # silently incomplete artifact.
          for s in ATH9K_HTC CARL9170 RTL8187 RTL8XXXU RT2800USB MT7601U MT76x0U MT76x2U; do
            if ! grep -q "^CONFIG_${s}=m" common/out/.config; then
              echo "::error::CONFIG_${s} did not stick - aborting"
              echo "--- config state for diagnosis ---"
              grep -E 'CONFIG_(RT2X00|MT76|WLAN_VENDOR|MAC80211|CFG80211)' common/out/.config || true
              exit 1
            fi
          done
          echo "All WiFi driver configs confirmed =m"
          # v10 fail-fast: MAC80211_LEDS must be OFF in the final config
          # (its symbols are missing from the stock kernel core).
          echo "--- v10 config checks ---"
          grep -E 'CONFIG_(MAC80211_LEDS|NL80211_TESTMODE)' common/out/.config || true
          if grep -q '^CONFIG_MAC80211_LEDS=y' common/out/.config; then
            echo "::error::MAC80211_LEDS is still =y - aborting before the long build"
            exit 1
          fi
          # Extras are best-effort (some may be blocked by GKI hidden
          # configs) - report which ones stuck, never abort for these.
          echo "--- v7 extras report (stuck = will be in artifact) ---"
          for s in ZD1211RW RT73USB RT2500USB RTL8192CU ATH10K_USB USB_RTL8152 \
                   CAN_GS_USB NFC_PN533_USB IEEE802154_ATUSB DVB_USB_RTL28XXU \
                   USB_SERIAL_OPTION BT_HCIUART; do
            if grep -q "^CONFIG_${s}=m" common/out/.config; then
              echo "  OK   CONFIG_${s}=m"
            else
              echo "  SKIP CONFIG_${s} (dropped by kconfig)"
            fi
          done

      - name: Add nethunter_compat shim module (v11)
        run: |
          # The shipped GKI kernel trimmed a few EXPORT_SYMBOL entries that
          # no vendor module used (usb_init_urb, clk_get_sys, ...), which
          # leaves several USB WiFi drivers unloadable. This shim module
          # re-provides them; bodies copied from the same pinned source.
          mkdir -p common/drivers/nethunter-compat
          cat > common/drivers/nethunter-compat/nethunter_compat.c <<'SHIM_EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/string.h>
          #include <linux/usb.h>
          #include <linux/bitmap.h>
          #include <linux/leds.h>
          #include <linux/workqueue.h>
          #include <linux/clk.h>
          #include <linux/err.h>
          #include <linux/device.h>
          #include <linux/firmware.h>

          /* drivers/usb/core/urb.c (verbatim) */
          void usb_init_urb(struct urb *urb)
          {
          	if (urb) {
          		memset(urb, 0, sizeof(*urb));
          		kref_init(&urb->kref);
          		INIT_LIST_HEAD(&urb->urb_list);
          		INIT_LIST_HEAD(&urb->anchor_list);
          	}
          }
          EXPORT_SYMBOL_GPL(usb_init_urb);

          /* drivers/usb/core/urb.c (usb_unpoison_urb inlined) */
          void usb_unpoison_anchored_urbs(struct usb_anchor *anchor)
          {
          	unsigned long flags;
          	struct urb *lazarus;

          	spin_lock_irqsave(&anchor->lock, flags);
          	list_for_each_entry(lazarus, &anchor->urb_list, anchor_list) {
          		atomic_dec(&lazarus->reject);
          	}
          	anchor->poisoned = 0;
          	spin_unlock_irqrestore(&anchor->lock, flags);
          }
          EXPORT_SYMBOL_GPL(usb_unpoison_anchored_urbs);

          /* lib/bitmap.c (verbatim) */
          void __bitmap_shift_right(unsigned long *dst, const unsigned long *src,
          			unsigned shift, unsigned nbits)
          {
          	unsigned k, lim = BITS_TO_LONGS(nbits);
          	unsigned off = shift/BITS_PER_LONG, rem = shift % BITS_PER_LONG;
          	unsigned long mask = BITMAP_LAST_WORD_MASK(nbits);
          	for (k = 0; off + k < lim; ++k) {
          		unsigned long upper, lower;

          		if (!rem || off + k + 1 >= lim)
          			upper = 0;
          		else {
          			upper = src[off + k + 1];
          			if (off + k + 1 == lim - 1)
          				upper &= mask;
          			upper <<= (BITS_PER_LONG - rem);
          		}
          		lower = src[off + k];
          		if (off + k == lim - 1)
          			lower &= mask;
          		lower >>= rem;
          		dst[k] = lower | upper;
          	}
          	if (off)
          		memset(&dst[lim - off], 0, off*sizeof(unsigned long));
          }
          EXPORT_SYMBOL(__bitmap_shift_right);

          /* drivers/leds/led-class.c (reduced to the brightness_set callback;
           * the original's led_set_brightness_nopm is itself trimmed) */
          void led_classdev_suspend(struct led_classdev *led_cdev)
          {
          	led_cdev->flags |= LED_SUSPENDED;
          	if (led_cdev->brightness_set)
          		led_cdev->brightness_set(led_cdev, LED_OFF);
          	flush_work(&led_cdev->set_brightness_work);
          }
          EXPORT_SYMBOL_GPL(led_classdev_suspend);

          void led_classdev_resume(struct led_classdev *led_cdev)
          {
          	if (led_cdev->brightness_set)
          		led_cdev->brightness_set(led_cdev, led_cdev->brightness);
          	if (led_cdev->flash_resume)
          		led_cdev->flash_resume(led_cdev);
          	led_cdev->flags &= ~LED_SUSPENDED;
          }
          EXPORT_SYMBOL_GPL(led_classdev_resume);

          /* drivers/clk/clkdev.c stub: rt2800lib calls clk_get_sys only on
           * the Ralink SoC path and already falls back to a default rate
           * when the lookup fails; USB adapters never take that path. The
           * real lookup table lives in built-in clk core state. */
          struct clk *clk_get_sys(const char *dev_id, const char *con_id)
          {
          	return ERR_PTR(-ENODEV);
          }
          EXPORT_SYMBOL(clk_get_sys);

          /* drivers/base/firmware_loader/main.c stub: the real function only
           * registers the name in the built-in suspend/resume firmware
           * cache; drivers still load firmware via request_firmware(). */
          int firmware_request_cache(struct device *device, const char *name)
          {
          	return 0;
          }
          EXPORT_SYMBOL_GPL(firmware_request_cache);

          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("NetHunter compat shim: re-provides GKI-trimmed exports");
          SHIM_EOF
          printf 'obj-m += nethunter_compat.o\n' > common/drivers/nethunter-compat/Makefile
          echo 'obj-m += nethunter-compat/' >> common/drivers/Makefile
          echo "shim module added"

      - name: Build Image + modules
        run: |
          make -C common O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image modules
          strings common/out/vmlinux | grep -m1 "Linux version" >> build-info.txt || true

      - name: Package modules artifact
        run: |
          set -e
          mkdir -p artifact-modules/modules artifact-modules/fallback
          # Stock ROM already loads cfg80211/mac80211 -> keep ours as fallback only
          for f in $(find common/out -name '*.ko'); do
            case "$(basename "$f")" in
              cfg80211.ko|mac80211.ko) cp -v "$f" artifact-modules/fallback/ ;;
              *) cp -v "$f" artifact-modules/modules/ ;;
            esac
          done
          cp common/out/.config artifact-modules/build-config.txt
          cp common/out/Module.symvers artifact-modules/ 2>/dev/null || true
          cp build-info.txt artifact-modules/
          cp scripts/load-wifi-drivers.sh scripts/unload-wifi-drivers.sh artifact-modules/
          # Strip debug info (raw .ko files are tens of MB; loading does not
          # need it) - best effort only.
          if command -v llvm-strip >/dev/null 2>&1; then
            for f in artifact-modules/modules/*.ko artifact-modules/fallback/*.ko; do
              llvm-strip --strip-debug "$f" 2>/dev/null || true
            done
          fi
          echo "--- modules/ ---"; ls artifact-modules/modules/
          echo "--- fallback/ ---"; ls artifact-modules/fallback/
          # v9 verification: our cfg80211 must reproduce the stock CRC for
          # wiphy_new_nm, and our mac80211 must not reference LED triggers.
          crc=$(awk '$2=="wiphy_new_nm" {print $1}' common/out/Module.symvers)
          echo "wiphy_new_nm CRC in this build: $crc (stock: 0xac389d85)"
          if [ "$crc" != "0xac389d85" ]; then
            echo "::error::wiphy_new_nm CRC does not match stock - mac80211 swap would fail"
            exit 1
          fi
          if strings artifact-modules/fallback/mac80211.ko | grep -q 'led_trigger_blink'; then
            echo "::error::mac80211 still references LED trigger symbols"
            exit 1
          fi
          echo "CRC + LED checks passed - mac80211 should load on the stock kernel"
          # Fail LOUDLY if the WiFi drivers are missing again.
          for f in ath9k_htc.ko ath9k_hw.ko ath.ko rt2800usb.ko mt7601u.ko rtl8187.ko rtl8xxxu.ko carl9170.ko nethunter_compat.ko crc-ccitt.ko; do
            if [ ! -f "artifact-modules/modules/$f" ]; then
              echo "::error::Expected module $f missing from artifact"
              exit 1
            fi
          done
          echo "All key WiFi modules present in artifact"

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx709s-nethunter-modules
          path: artifact-modules/
